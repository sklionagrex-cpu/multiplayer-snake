<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Multiplayer Snake</title>
<style>
  :root {
    --bg: #0a120a;
    --card: #121f12;
    --card2: #1a2b1a;
    --line: #243324;
    --accent: #4ade80;
    --accent-dim: #22c55e;
    --text: #e8ffe8;
    --muted: #7a9a7a;
    --danger: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  .screen { display: none; min-height: 100vh; padding: 18px; padding-bottom: 88px; }
  .screen.active { display: block; }
  .screen.profile-screen { padding: 0 0 88px; }
  .logo { text-align: center; margin: 36px 0 28px; }
  .logo-mark {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 18px;
    background: linear-gradient(145deg, #1a3d1a, #0d1f0d);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 36px; height: 36px; stroke: var(--accent); fill: none; stroke-width: 1.6; }
  .logo h1 { font-size: 22px; color: var(--accent); font-weight: 700; }
  .logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .field {
    width: 100%; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; color: var(--text); padding: 14px 16px;
    font-size: 16px; margin-bottom: 12px; outline: none;
  }
  .field:focus { border-color: var(--accent); }
  .btn {
    width: 100%; border: none; border-radius: 12px; padding: 14px;
    font-size: 15px; font-weight: 650; cursor: pointer; margin-top: 6px;
  }
  .btn-primary { background: var(--accent); color: #052e16; }
  .btn-primary:active { background: var(--accent-dim); }
  .btn-primary:disabled { opacity: 0.55; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn-danger { background: #2a1515; color: var(--danger); border: 1px solid #3f2020; }
  .btn-small {
    width: auto; padding: 8px 14px; font-size: 13px; background: var(--accent);
    color: #052e16; border-radius: 10px; border: none; font-weight: 650;
  }
  .btn-tiny {
    padding: 7px 11px; font-size: 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); font-weight: 600;
  }
  .btn-tiny.friend { color: #7dd3fc; border-color: #1e3a4a; }
  .btn-tiny.ok { color: var(--accent); }
  .status { text-align: center; color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .status.ok { color: var(--accent); }
  .topbar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px; min-height: 40px;
  }
  .topbar h2 { font-size: 18px; color: var(--accent); flex: 1; font-weight: 700; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.danger { color: var(--danger); }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 10px; border: 1px solid var(--line);
  }
  .card h3 { font-size: 15px; margin-bottom: 4px; font-weight: 650; }
  .card .desc { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .card .meta { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .card .row { display: flex; align-items: center; justify-content: flex-end; margin-top: 10px; gap: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
  .user-row {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: var(--card); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--line);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px; background: var(--card2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    overflow: hidden; border: 1px solid var(--line);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.6; }
  .host-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; background: #143214; color: var(--accent);
    font-size: 11px; padding: 2px 8px; border-radius: 6px; margin-left: 6px; font-weight: 600;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-info .name { font-weight: 650; font-size: 15px; }
  .user-info .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,18,10,.96);
    border-top: 1px solid var(--line); display: flex;
    padding: 6px 8px max(6px, env(safe-area-inset-bottom)); z-index: 50;
  }
  .nav button {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 11px; font-weight: 600; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.active { color: var(--accent); }
  .fab {
    position: fixed; right: 16px; bottom: 78px; width: 48px; height: 48px;
    border-radius: 14px; background: var(--card); border: 1px solid var(--line);
    color: var(--accent); z-index: 60; display: none; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0.5;
  }
  .fab.show { display: flex; }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 20px 20px 0 0; padding: 20px;
    width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  .modal h3 { color: var(--accent); margin-bottom: 12px; font-size: 17px; }
  /* Telegram-like profile header */
  .profile-cover {
    position: relative; width: 100%; height: 220px;
    background: linear-gradient(160deg, #1a3d1a 0%, #0d1a0d 100%);
    overflow: hidden;
  }
  .profile-cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .profile-cover .placeholder {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  }
  .profile-cover .placeholder svg { width: 72px; height: 72px; stroke: var(--accent); fill: none; stroke-width: 1.4; opacity: 0.7; }
  .profile-cover .top-actions {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .profile-cover .top-actions .icon-btn {
    background: rgba(0,0,0,.35); border-color: transparent; color: #fff; backdrop-filter: blur(6px);
  }
  .profile-meta {
    padding: 16px 18px 8px; margin-top: -28px; position: relative;
  }
  .profile-meta .name {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  }
  .profile-actions { padding: 8px 18px 0; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .pad { padding: 0 18px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a3 3 0 0 1 0 5.74"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="3"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
  <symbol id="i-snake" viewBox="0 0 24 24"><path d="M4 15c2-6 6-8 10-6 3 1.5 4 4 4 6"/><path d="M14 15c0 2-1.5 4-4 4s-4-1.5-4-3"/><circle cx="17" cy="9" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
</svg>

<div class="screen active" id="screen-login">
  <div class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><use href="#i-snake"/></svg></div>
    <h1>Multiplayer Snake</h1>
    <p>Minecraft PE 1.1.5</p>
  </div>
  <input class="field" id="login-user" placeholder="Ник" autocomplete="username">
  <input class="field" id="login-pass" type="password" placeholder="Пароль" autocomplete="current-password">
  <button class="btn btn-primary" onclick="doLogin()">Войти</button>
  <button class="btn btn-ghost" onclick="show('register')">Регистрация</button>
  <div class="status" id="login-status"></div>
</div>

<div class="screen" id="screen-register">
  <div class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><use href="#i-snake"/></svg></div>
    <h1>Регистрация</h1>
  </div>
  <input class="field" id="reg-user" placeholder="Ник (мин. 3)">
  <input class="field" id="reg-pass" type="password" placeholder="Пароль (мин. 4)">
  <input class="field" id="reg-pass2" type="password" placeholder="Повтор пароля">
  <button class="btn btn-primary" onclick="doRegister()">Создать аккаунт</button>
  <button class="btn btn-ghost" onclick="show('login')">Назад</button>
  <div class="status" id="reg-status"></div>
</div>

<div class="screen" id="screen-worlds">
  <div class="topbar">
    <h2>Миры</h2>
    <button class="icon-btn" onclick="loadWorlds()"><svg viewBox="0 0 24 24"><use href="#i-refresh"/></svg></button>
  </div>
  <p class="subtitle" id="worlds-sub">Загрузка...</p>
  <div id="world-list"></div>
  <button class="btn btn-primary" onclick="show('host')">Открыть свой мир</button>
</div>

<div class="screen" id="screen-host">
  <div class="topbar">
    <button class="icon-btn" onclick="show('worlds')"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h2>Открыть мир</h2>
  </div>
  <input class="field" id="host-name" placeholder="Название мира">
  <input class="field" id="host-desc" placeholder="Описание">
  <input class="field" id="host-max" type="number" value="5" min="2" max="10" placeholder="Макс. игроков">
  <button class="btn btn-primary" id="btn-host" onclick="doHost()">Создать и открыть Minecraft</button>
  <div class="status" id="host-status"></div>
</div>

<div class="screen profile-screen" id="screen-profile">
  <div class="profile-cover" id="profile-cover">
    <div class="placeholder"><svg viewBox="0 0 24 24"><use href="#i-user"/></svg></div>
    <div class="top-actions">
      <button class="icon-btn danger" onclick="doLogout()"><svg viewBox="0 0 24 24"><use href="#i-logout"/></svg></button>
    </div>
  </div>
  <div class="profile-meta">
    <div class="name" id="profile-name">—</div>
  </div>
  <div class="profile-actions">
    <button class="btn btn-primary" onclick="show('avatar')">Сменить фото</button>
    <button class="btn btn-ghost" onclick="show('friends')">Друзья</button>
    <button class="btn btn-ghost" onclick="show('blocks')">Чёрный список</button>
  </div>
</div>

<div class="screen" id="screen-avatar">
  <div class="topbar">
    <button class="icon-btn" onclick="show('profile')"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h2>Фото профиля</h2>
  </div>
  <div class="profile-cover" id="avatar-preview" style="border-radius:16px;height:200px;margin-bottom:14px">
    <div class="placeholder"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg></div>
  </div>
  <input type="file" id="avatar-file" accept="image/*" capture="environment">
  <button class="btn btn-primary" onclick="pickPhoto()">Выбрать фото</button>
  <button class="btn btn-ghost" onclick="clearPhoto()">Сбросить</button>
  <button class="btn btn-primary" onclick="savePhoto()">Сохранить</button>
  <div class="status" id="avatar-status"></div>
</div>

<div class="screen" id="screen-friends">
  <div class="topbar">
    <button class="icon-btn" onclick="show('profile')"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h2>Друзья</h2>
  </div>
  <input class="field" id="friend-search" placeholder="Поиск по нику..." oninput="onSearchFriends()">
  <div id="friend-search-results"></div>
  <p class="subtitle" style="margin-top:8px">Твои друзья</p>
  <div id="friend-list"></div>
</div>

<div class="screen" id="screen-blocks">
  <div class="topbar">
    <button class="icon-btn" onclick="show('profile')"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h2>Чёрный список</h2>
  </div>
  <div id="block-list"></div>
</div>

<div class="nav" id="main-nav" style="display:none">
  <button id="nav-worlds" onclick="show('worlds')"><svg viewBox="0 0 24 24"><use href="#i-globe"/></svg>Миры</button>
  <button id="nav-friends" onclick="show('friends')"><svg viewBox="0 0 24 24"><use href="#i-users"/></svg>Друзья</button>
  <button id="nav-profile" onclick="show('profile')"><svg viewBox="0 0 24 24"><use href="#i-user"/></svg>Профиль</button>
</div>

<button class="fab" id="fab-snake" onclick="openServersModal()"><svg viewBox="0 0 24 24"><use href="#i-snake"/></svg></button>

<div class="modal-bg" id="modal-servers" onclick="if(event.target===this)closeModals()">
  <div class="modal">
    <h3>Активные серверы</h3>
    <div id="modal-server-list"></div>
    <button class="btn btn-ghost" onclick="closeModals()">Закрыть</button>
  </div>
</div>

<div class="modal-bg" id="modal-host-panel" onclick="if(event.target===this)closeModals()">
  <div class="modal">
    <h3 id="panel-title">Игроки в мире</h3>
    <p class="subtitle">Отклик: <b id="host-ping">—</b> мс</p>
    <div id="host-players"></div>
    <button class="btn btn-danger" id="btn-stop-host" style="margin-top:12px;display:none" onclick="stopHosting()">Остановить хост</button>
    <button class="btn btn-ghost" onclick="closeModals()">Закрыть</button>
  </div>
</div>

<script>
const API = localStorage.getItem('api_url') || 'https://snake-master-3pzr.onrender.com';
let token = localStorage.getItem('token') || '';
let user = null;
let pendingPhoto = null;
let myWorldId = null;
let joinedWorldId = null;
let heartbeatTimer = null;
let presenceTimer = null;
let searchTimer = null;
let lastLanRtt = 0;
let hostBusy = false;

try { user = JSON.parse(localStorage.getItem('user') || 'null'); } catch(e) {}

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
  const nav = document.getElementById('main-nav');
  const authed = ['worlds','host','profile','avatar','friends','blocks'].includes(name);
  nav.style.display = authed ? 'flex' : 'none';
  document.getElementById('fab-snake').classList.toggle('show', authed);
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if (name === 'friends') document.getElementById('nav-friends').classList.add('active');
  else if (name === 'profile' || name === 'avatar' || name === 'blocks') document.getElementById('nav-profile').classList.add('active');
  else if (authed) document.getElementById('nav-worlds').classList.add('active');
  if (name === 'worlds') loadWorlds();
  if (name === 'profile') renderProfile();
  if (name === 'avatar') renderAvatarPreview();
  if (name === 'friends') { loadFriends(); document.getElementById('friend-search').value=''; document.getElementById('friend-search-results').innerHTML=''; }
  if (name === 'blocks') loadBlocks();
}

function setStatus(id, text, ok) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text || '';
  el.className = 'status' + (ok ? ' ok' : '');
}

function saveAuth(t, u) {
  token = t; user = u;
  localStorage.setItem('token', t);
  localStorage.setItem('user', JSON.stringify(u));
}

function doLogout() {
  token = ''; user = null; myWorldId = null; joinedWorldId = null;
  stopHeartbeat(); stopPresence();
  try { if (window.AndroidBridge) AndroidBridge.stopOverlay(); } catch(e) {}
  localStorage.removeItem('token'); localStorage.removeItem('user');
  show('login');
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  let data = null;
  try { data = await r.json(); } catch(e) {}
  return { r, data };
}

async function measureLanRtt() {
  const t0 = performance.now();
  try {
    await fetch(API + '/health', { cache: 'no-store' });
    lastLanRtt = Math.max(1, Math.round(performance.now() - t0));
  } catch (e) { lastLanRtt = lastLanRtt || 999; }
  return lastLanRtt;
}

function startPresence(worldId, isHost) {
  stopPresence();
  joinedWorldId = worldId;
  if (isHost) myWorldId = worldId;
  const tick = async () => {
    const rtt = await measureLanRtt();
    try { await api('POST', '/worlds/' + worldId + '/presence', { action: 'heartbeat', rtt_ms: rtt }); } catch (e) {}
  };
  tick();
  presenceTimer = setInterval(tick, 8000);
}

function stopPresence() {
  if (presenceTimer) clearInterval(presenceTimer);
  presenceTimer = null;
  if (joinedWorldId) {
    api('POST', '/worlds/' + joinedWorldId + '/presence', { action: 'leave' }).catch(()=>{});
  }
}

function launchMinecraft() {
  try {
    if (window.AndroidBridge && AndroidBridge.launchMinecraft) {
      AndroidBridge.launchMinecraft();
      setTimeout(() => { try { AndroidBridge.startOverlay(); } catch(e) {} }, 600);
      return;
    }
  } catch(e) {}
}

function setAvatarEl(el, u) {
  if (!el) return;
  if (u && u.avatar_url) el.innerHTML = '<img alt="" src="' + u.avatar_url + '">';
  else el.innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-user"/></svg>';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  setStatus('login-status', 'Вход...');
  try {
    const { r, data } = await api('POST', '/login', { username, password });
    if (!r.ok) { setStatus('login-status', (data && data.detail) || 'Ошибка входа'); return; }
    saveAuth(data.access_token, data.user);
    show('worlds');
  } catch (e) { setStatus('login-status', 'Нет связи с сервером'); }
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value;
  const password2 = document.getElementById('reg-pass2').value;
  if (password !== password2) { setStatus('reg-status', 'Пароли не совпадают'); return; }
  setStatus('reg-status', 'Регистрация...');
  try {
    const { r, data } = await api('POST', '/register', { username, password });
    if (!r.ok) { setStatus('reg-status', (data && data.detail) || 'Ошибка'); return; }
    saveAuth(data.access_token, data.user);
    show('worlds');
  } catch (e) { setStatus('reg-status', 'Нет связи с сервером'); }
}

async function loadWorlds() {
  const list = document.getElementById('world-list');
  const sub = document.getElementById('worlds-sub');
  sub.textContent = 'Обновление...';
  list.innerHTML = '';
  try {
    const { r, data } = await api('GET', '/worlds');
    if (!r.ok) { sub.textContent = 'Не удалось загрузить'; return; }
    const worlds = data || [];
    sub.textContent = worlds.length ? ('Открытых миров: ' + worlds.length) : 'Нет открытых миров';
    if (!worlds.length) {
      list.innerHTML = '<div class="empty">Пока тихо — открой свой мир</div>';
      return;
    }
    worlds.forEach(w => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<h3>' + escapeHtml(w.name) + '</h3>' +
        '<div class="desc">' + escapeHtml(w.description || '') + '</div>' +
        '<div class="meta"><span class="host-dot"></span>' + escapeHtml(w.owner_username || '?') +
        ' · ' + (w.player_count || 0) + '/' + (w.max_players || 5) + '</div>' +
        '<div class="row"><button class="btn-small">Играть</button></div>';
      el.querySelector('button').onclick = () => joinWorld(w);
      list.appendChild(el);
    });
  } catch (e) { sub.textContent = 'Нет связи с сервером'; }
}

async function joinWorld(w) {
  try {
    const { r, data } = await api('POST', '/worlds/' + w.id + '/join-check');
    if (!r.ok) { alert((data && data.detail) || 'Нельзя присоединиться'); return; }
  } catch (e) { alert('Нет связи'); return; }
  startPresence(w.id, false);
  launchMinecraft();
}

async function doHost() {
  if (hostBusy) return;
  const name = document.getElementById('host-name').value.trim();
  const description = document.getElementById('host-desc').value.trim();
  let max_players = parseInt(document.getElementById('host-max').value || '5', 10);
  if (!name) { setStatus('host-status', 'Введи название'); return; }
  if (isNaN(max_players)) max_players = 5;
  hostBusy = true;
  const btn = document.getElementById('btn-host');
  if (btn) btn.disabled = true;
  setStatus('host-status', 'Открываем...');
  try {
    // close previous host world first if any
    if (myWorldId) {
      try { await api('DELETE', '/worlds/' + myWorldId); } catch(e) {}
      myWorldId = null;
    }
    const { r, data } = await api('POST', '/worlds', { name, description, max_players });
    if (!r.ok) { setStatus('host-status', (data && data.detail) || 'Ошибка'); return; }
    myWorldId = data.id;
    setStatus('host-status', 'Готово', true);
    startHeartbeat();
    startPresence(data.id, true);
    setTimeout(launchMinecraft, 250);
  } catch (e) {
    setStatus('host-status', 'Нет связи с сервером');
  } finally {
    hostBusy = false;
    if (btn) btn.disabled = false;
  }
}

function startHeartbeat() {
  stopHeartbeat();
  if (!myWorldId) return;
  const beat = () => api('POST', '/worlds/' + myWorldId + '/heartbeat', { player_count: 1 }).catch(()=>{});
  beat();
  heartbeatTimer = setInterval(beat, 25000);
}
function stopHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}

function renderProfile() {
  if (!user) return;
  document.getElementById('profile-name').textContent = user.username;
  const cover = document.getElementById('profile-cover');
  const actions = cover.querySelector('.top-actions');
  if (user.avatar_url) {
    cover.innerHTML = '<img alt="" src="' + user.avatar_url + '">';
  } else {
    cover.innerHTML = '<div class="placeholder"><svg viewBox="0 0 24 24"><use href="#i-user"/></svg></div>';
  }
  const bar = document.createElement('div');
  bar.className = 'top-actions';
  bar.innerHTML = '<button class="icon-btn danger" onclick="doLogout()"><svg viewBox="0 0 24 24"><use href="#i-logout"/></svg></button>';
  cover.appendChild(bar);
}

function renderAvatarPreview() {
  pendingPhoto = user && user.avatar_url ? user.avatar_url : null;
  const el = document.getElementById('avatar-preview');
  if (pendingPhoto) el.innerHTML = '<img alt="" src="' + pendingPhoto + '">';
  else el.innerHTML = '<div class="placeholder"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg></div>';
}

function pickPhoto() {
  document.getElementById('avatar-file').click();
}

document.getElementById('avatar-file').addEventListener('change', function(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 512;
      let w = img.width, h = img.height;
      if (w > h) { if (w > max) { h = h * max / w; w = max; } }
      else { if (h > max) { w = w * max / h; h = max; } }
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w); canvas.height = Math.round(h);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.78);
      document.getElementById('avatar-preview').innerHTML = '<img alt="" src="' + pendingPhoto + '">';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

function clearPhoto() {
  pendingPhoto = null;
  document.getElementById('avatar-preview').innerHTML = '<div class="placeholder"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg></div>';
  document.getElementById('avatar-file').value = '';
}

async function savePhoto() {
  setStatus('avatar-status', 'Сохранение...');
  try {
    const { r, data } = await api('PATCH', '/me', { avatar_data: pendingPhoto || '' });
    if (!r.ok) { setStatus('avatar-status', (data && data.detail) || 'Ошибка'); return; }
    user = data;
    localStorage.setItem('user', JSON.stringify(user));
    setStatus('avatar-status', 'Сохранено', true);
    setTimeout(() => show('profile'), 350);
  } catch (e) { setStatus('avatar-status', 'Нет связи'); }
}

async function loadFriends() {
  const list = document.getElementById('friend-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    const { r, data } = await api('GET', '/friends');
    if (!r.ok) { list.innerHTML = '<div class="empty">Ошибка</div>'; return; }
    const friends = data || [];
    if (!friends.length) { list.innerHTML = '<div class="empty">Нет друзей</div>'; return; }
    list.innerHTML = '';
    friends.forEach(f => {
      const row = document.createElement('div');
      row.className = 'user-row';
      const av = document.createElement('div'); av.className = 'avatar'; setAvatarEl(av, f); row.appendChild(av);
      const info = document.createElement('div'); info.className = 'user-info';
      info.innerHTML = '<div class="name">' + escapeHtml(f.username) +
        (f.hosting ? '<span class="badge"><span class="host-dot"></span>хост</span>' : '') +
        '</div><div class="sub">' + (f.hosting ? escapeHtml(f.hosting.name) : '') + '</div>';
      row.appendChild(info);
      const actions = document.createElement('div');
      if (f.hosting) {
        const j = document.createElement('button');
        j.className = 'btn-small'; j.textContent = 'Играть';
        j.onclick = () => joinWorld(f.hosting);
        actions.appendChild(j);
      }
      const rm = document.createElement('button');
      rm.className = 'btn-tiny'; rm.textContent = 'Удалить'; rm.style.marginLeft = '6px';
      rm.onclick = async () => { await api('DELETE', '/friends/' + f.id); loadFriends(); };
      actions.appendChild(rm);
      row.appendChild(actions);
      list.appendChild(row);
    });
  } catch (e) { list.innerHTML = '<div class="empty">Нет связи</div>'; }
}

function onSearchFriends() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearchFriends, 280);
}

async function doSearchFriends() {
  const q = document.getElementById('friend-search').value.trim();
  const box = document.getElementById('friend-search-results');
  if (q.length < 1) { box.innerHTML = ''; return; }
  try {
    const { r, data } = await api('GET', '/users/search?q=' + encodeURIComponent(q));
    if (!r.ok) { box.innerHTML = ''; return; }
    const users = data || [];
    if (!users.length) { box.innerHTML = '<div class="empty">Никого не найдено</div>'; return; }
    box.innerHTML = '';
    users.forEach(u => {
      const row = document.createElement('div');
      row.className = 'user-row';
      const av = document.createElement('div'); av.className = 'avatar'; setAvatarEl(av, u); row.appendChild(av);
      const info = document.createElement('div'); info.className = 'user-info';
      info.innerHTML = '<div class="name">' + escapeHtml(u.username) + '</div>';
      row.appendChild(info);
      const btn = document.createElement('button');
      btn.className = 'btn-tiny friend';
      if (u.is_friend) { btn.textContent = 'В друзьях'; btn.disabled = true; btn.style.opacity = '.5'; }
      else if (u.is_blocked) { btn.textContent = 'В ЧС'; btn.disabled = true; btn.style.opacity = '.5'; }
      else {
        btn.textContent = 'Добавить';
        btn.onclick = async () => { await api('POST', '/friends/' + u.id); doSearchFriends(); loadFriends(); };
      }
      row.appendChild(btn);
      box.appendChild(row);
    });
  } catch (e) { box.innerHTML = '<div class="empty">Ошибка поиска</div>'; }
}

async function loadBlocks() {
  const list = document.getElementById('block-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    const { r, data } = await api('GET', '/blocks');
    if (!r.ok) { list.innerHTML = '<div class="empty">Ошибка</div>'; return; }
    const blocks = data || [];
    if (!blocks.length) { list.innerHTML = '<div class="empty">Список пуст</div>'; return; }
    list.innerHTML = '';
    blocks.forEach(u => {
      const row = document.createElement('div');
      row.className = 'user-row';
      const av = document.createElement('div'); av.className = 'avatar'; setAvatarEl(av, u); row.appendChild(av);
      const info = document.createElement('div'); info.className = 'user-info';
      info.innerHTML = '<div class="name">' + escapeHtml(u.username) + '</div>';
      row.appendChild(info);
      const btn = document.createElement('button');
      btn.className = 'btn-tiny ok'; btn.textContent = 'Разбанить';
      btn.onclick = async () => { await api('DELETE', '/blocks/' + u.id); loadBlocks(); };
      row.appendChild(btn);
      list.appendChild(row);
    });
  } catch (e) { list.innerHTML = '<div class="empty">Нет связи</div>'; }
}

function closeModals() {
  document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('show'));
}

async function openServersModal() {
  const wid = myWorldId || joinedWorldId;
  if (wid) { await openPlayerPanel(wid); return; }
  const list = document.getElementById('modal-server-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';
  document.getElementById('modal-servers').classList.add('show');
  try {
    const { r, data } = await api('GET', '/worlds');
    const worlds = (r.ok && data) || [];
    if (!worlds.length) { list.innerHTML = '<div class="empty">Нет активных хостов</div>'; return; }
    list.innerHTML = '';
    worlds.forEach(w => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = '<h3>' + escapeHtml(w.name) + '</h3><div class="meta">' +
        escapeHtml(w.owner_username) + ' · ' + w.player_count + '/' + w.max_players +
        '</div><div class="row"><button class="btn-small">Играть</button></div>';
      el.querySelector('button').onclick = () => { closeModals(); joinWorld(w); };
      list.appendChild(el);
    });
  } catch (e) { list.innerHTML = '<div class="empty">Нет связи</div>'; }
}

async function openPlayerPanel(worldId) {
  document.getElementById('modal-host-panel').classList.add('show');
  document.getElementById('host-ping').textContent = String(await measureLanRtt());
  const box = document.getElementById('host-players');
  box.innerHTML = '<div class="empty">Загрузка...</div>';
  const stopBtn = document.getElementById('btn-stop-host');
  try {
    const { r, data } = await api('GET', '/worlds/' + worldId + '/players');
    if (!r.ok) { box.innerHTML = '<div class="empty">Ошибка</div>'; return; }
    const isOwner = data.is_owner;
    stopBtn.style.display = isOwner ? 'block' : 'none';
    document.getElementById('panel-title').textContent = isOwner ? 'Панель хоста' : 'Игроки в мире';
    const players = data.players || [];
    if (!players.length) { box.innerHTML = '<div class="empty">Пока только ты</div>'; return; }
    box.innerHTML = '';
    players.forEach(p => {
      const row = document.createElement('div');
      row.className = 'user-row';
      const av = document.createElement('div'); av.className = 'avatar'; setAvatarEl(av, p); row.appendChild(av);
      const info = document.createElement('div'); info.className = 'user-info';
      info.innerHTML = '<div class="name">' + escapeHtml(p.username) + (p.id === (user && user.id) ? ' (вы)' : '') +
        '</div><div class="sub">' + (p.rtt_ms || 0) + ' мс' + (p.is_host ? ' · хост' : '') + '</div>';
      row.appendChild(info);
      const actions = document.createElement('div');
      if (p.id !== (user && user.id)) {
        const fr = document.createElement('button');
        fr.className = 'btn-tiny friend'; fr.textContent = 'В друзья';
        fr.onclick = async () => { await api('POST', '/friends/' + p.id); fr.textContent = '✓'; fr.disabled = true; };
        actions.appendChild(fr);
        if (isOwner && !p.is_host) {
          const kick = document.createElement('button');
          kick.className = 'btn-tiny'; kick.textContent = 'Кик'; kick.style.marginLeft = '4px';
          kick.onclick = async () => { await api('POST', '/worlds/' + worldId + '/kick', { user_id: p.id }); };
          actions.appendChild(kick);
          const ban = document.createElement('button');
          ban.className = 'btn-tiny'; ban.textContent = 'Бан'; ban.style.marginLeft = '4px'; ban.style.color = 'var(--danger)';
          ban.onclick = async () => { await api('POST', '/worlds/' + worldId + '/ban', { user_id: p.id }); openPlayerPanel(worldId); };
          actions.appendChild(ban);
        }
      }
      row.appendChild(actions);
      box.appendChild(row);
    });
  } catch (e) { box.innerHTML = '<div class="empty">Нет связи</div>'; }
}

async function stopHosting() {
  const wid = myWorldId;
  stopPresence();
  stopHeartbeat();
  if (wid) {
    try { await api('DELETE', '/worlds/' + wid); } catch(e) {}
  }
  myWorldId = null;
  joinedWorldId = null;
  try { if (window.AndroidBridge) AndroidBridge.stopOverlay(); } catch(e) {}
  closeModals();
  show('worlds');
}

// When app resumes / visibility — if host left, close world immediately path is stopHosting
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (myWorldId || joinedWorldId) loadWorlds();
  }
});

if (token && user) show('worlds');
else show('login');
</script>
