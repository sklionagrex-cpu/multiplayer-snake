plugins {
    id "com.android.application"
}

android {
    namespace "com.snake.mcpe"
    compileSdk 34

    defaultConfig {
        applicationId "com.snake.mcpe"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.5.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
}
